[package]
name = "app"
version = "0.1.0"
license = "MIT"
description = "A Tauri App"
authors = ["you"]
repository = ""
edition = "2024"
rust-version = "1.85.0"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.1", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tokio = { version = "1", features = ["full"] }
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-deep-link = "2"
shadowmesh-core = { path = "../../../libs/core-shared/shadowmesh-core" }
shadowmesh-daemon = { path = "../../daemon" }
bytes = "1.9"
uuid = { version = "1.0", features = ["v4"] }
url = "2.5"
