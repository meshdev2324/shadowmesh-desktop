[workspace]
resolver = "2"
members = [
    "libs/core-shared/shadowmesh-core",
    "services/server",
    "apps/daemon",
    "libs/core-shared/shadowmesh-common",
    "libs/core-shared/shadowmesh-ebpf",
    "apps/desktop-native",
    "tools/ss2022-reference",
    "tools/wg-reconciler",
]

exclude = [
    "libs/core-shared/shadowmesh-core-ebpf",
    "services/server/shadowmesh-ebpf",
]


[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# ⚠️ `panic = "abort"` WAS HERE. It left for a reason, and the reason is
# named here so the next author does not put it back (RFC-049 RULING F97-1/2).
#
# WHY IT WAS HERE: the daemon's fail-stop posture. A panic in a daemon task
# used to kill the whole daemon — with it the IPC server, the tun, and the
# in-process kill switch.
#
# WHY IT LEFT: (a) it made the release build FAIL. Cargo forces every
# dependency to rebuild with `unwind` for a test build, and
# `shadowmesh-core`'s `crate-type = ["rlib", "cdylib"]` gives that target an
# UNHASHED output stem — so the second build overwrote the first (F97's
# E0463). (b) it governed the shipped `.so` too, and a panic in ONE UDL call
# on a customer's phone killed their whole VPN app: UniFFI's own
# `catch_unwind` never ran, because nothing unwound.
#
# WHERE THE POSTURE NOW LIVES: in SOURCE, in the daemon — an explicit
# `std::panic::set_hook` that records the panic and then calls
# `std::process::abort()` (`apps/daemon/src/fail_stop.rs`, installed from
# `apps/daemon/src/main.rs`). Cargo CANNOT scope `panic` per package
# ("Overrides cannot specify the `panic`, `lto`, or `rpath` settings"), so a
# global flag was the only way to get it — and a flag nobody can see in a
# diff is not a posture, it is an ambient condition (RULING F97-4).
#
# ⚠️ DO NOT PUT IT BACK. If the fail-stop posture is ever revisited, the
# place to revisit it is the daemon's hook — not this file (RFC-049 §6.1
# items 4 and 9).
strip = true
incremental = false

[workspace.dependencies]
shadowmesh-common = { path = "libs/core-shared/shadowmesh-common" }
shadowmesh-ebpf-common = { path = "libs/core-shared/shadowmesh-ebpf" }
shadowmesh-core = { path = "libs/core-shared/shadowmesh-core" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
rand = "0.8"
uuid = { version = "1.0", features = ["v4", "serde"] }
regex = "1"
tracing = "0.1"
aws-lc-rs = { version = "1.12" }
aya = { version = "0.13", features = ["async_tokio"] }
aya-ebpf = { version = "0.1" }
aya-log = { version = "0.2" }
aya-log-ebpf = { version = "0.1" }
arc-swap = "1.7"
rayon = "1.10"
num_cpus = "1.16"
hmac = "0.12"
hkdf = "0.12"
sha1 = "0.10"
md-5 = "0.10"
aes = "0.8"
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
proptest = "1.5"
loom = "0.7"
zeroize = { version = "1.8", features = ["derive"] }
x25519-dalek = "2.0"
subtle = "2.5"

futures = "0.3"
futures-util = "0.3"

[patch.crates-io]

# Benchmarks must run out of the box, without an undocumented
# `CARGO_PROFILE_BENCH_LTO=false` override: the core-rust workflow mandates
# `cargo bloat` / `cargo asm` style verification, so the harness has to work
# with no ceremony. Release keeps full LTO.
#
# Two settings are inherited from `[profile.release]` by cargo and must be
# relaxed here, and the earlier comment claimed only `lto` mattered while never
# actually setting it — which is why `cargo bench -p shadowmesh-core` still
# failed to build the package binary:
#
#   * `lto = true` + the bitcode cargo then demands makes the compiler emit LTO
#     bitcode it cannot load for this unit.
#   * `strip = true` strips what the benchmark's symbols need.
#
# The original failure also reported `? couldn't convert the error:
# anyhow::Error: std::error::Error is not satisfied` at `main.rs:65`, annotated
# "there are multiple different versions of crate `anyhow`". That annotation is
# a generic cargo hint and it is wrong: `Cargo.lock` holds exactly one `anyhow`
# (1.0.104, 18 references). It was not a duplicate crate and `panic = "abort"`
# did not cause it — setting `panic` on a bench profile is ignored by cargo
# anyway. The LTO bitcode failure was the real defect; the `anyhow` message came
# from the same broken build.
#
# `cargo check` in the dev profile always passed, which is why this only ever
# showed up under `cargo bench`.
#
# `panic` is deliberately not set here. Cargo warns on every build that the
# setting "is ignored for the bench profile", and an earlier version of this
# file set it anyway while crediting it with the fix. Removing it entirely was
# re-verified: `cargo bench -p shadowmesh-core --no-run` still exits 0. (An
# intermittent link failure seen right after that removal was a stale native
# object from a concurrent build, not this profile -- it did not reproduce.)
#
# So the settings that genuinely had to be relaxed are `lto` and `strip`.
[profile.bench]
debug = true
lto = "off"
strip = false
