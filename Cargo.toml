[workspace]
resolver = "2"
members = [
    "libs/core-shared/shadowmesh-core",
    "services/server",
    "apps/daemon",
    "libs/core-shared/shadowmesh-common",
    "libs/core-shared/shadowmesh-ebpf",
    "apps/desktop-native",
]

exclude = [
    "libs/core-shared/shadowmesh-core-ebpf",
    "services/server/shadowmesh-ebpf",
]


[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
incremental = false

[workspace.dependencies]
shadowmesh-common = { path = "libs/core-shared/shadowmesh-common" }
shadowmesh-ebpf-common = { path = "libs/core-shared/shadowmesh-ebpf" }
shadowmesh-core = { path = "libs/core-shared/shadowmesh-core" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
rand = "0.8"
uuid = { version = "1.0", features = ["v4", "serde"] }
regex = "1"
tracing = "0.1"
aws-lc-rs = { version = "1.12" }
aya = { version = "0.13", features = ["async_tokio"] }
aya-ebpf = { version = "0.1" }
aya-log = { version = "0.2" }
aya-log-ebpf = { version = "0.1" }
arc-swap = "1.7"
rayon = "1.10"
num_cpus = "1.16"
hmac = "0.12"
hkdf = "0.12"
sha1 = "0.10"
md-5 = "0.10"
aes = "0.8"
ctr = "0.9"
proptest = "1.5"
loom = "0.7"
zeroize = { version = "1.8", features = ["derive"] }
rand_core = "0.6"
x25519-dalek = "2.0"
subtle = "2.5"

futures = "0.3"
futures-util = "0.3"

[patch.crates-io]
x25519-dalek = { git = "https://github.com/dalek-cryptography/curve25519-dalek", branch = "main" }
